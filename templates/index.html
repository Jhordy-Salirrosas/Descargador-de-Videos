<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxDownloader Pro — Next Gen Media Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: {
                            base: '#0a0e1a',
                            card: 'rgba(255, 255, 255, 0.04)',
                            hover: 'rgba(255, 255, 255, 0.08)',
                            border: 'rgba(255, 255, 255, 0.08)',
                        },
                        neon: {
                            cyan: '#06b6d4',
                            violet: '#8b5cf6',
                            pink: '#ec4899',
                            green: '#10b981',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ===== BASE DARK THEME ===== */
        body {
            background: #0a0e1a;
            min-height: 100vh;
            overflow-x: hidden;
            color: #e2e8f0;
        }

        /* ===== AURORA BACKGROUND ===== */
        .aurora-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
            top: -10%;
            left: -5%;
            animation: drift-1 20s ease-in-out infinite alternate;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
            top: 50%;
            right: -10%;
            animation: drift-2 25s ease-in-out infinite alternate;
        }

        .blob-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #1e40af 0%, transparent 70%);
            bottom: -10%;
            left: 30%;
            animation: drift-3 22s ease-in-out infinite alternate;
        }

        .blob-4 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            top: 30%;
            left: 50%;
            opacity: 0.2;
            animation: drift-4 28s ease-in-out infinite alternate;
        }

        @keyframes drift-1 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(80px, 60px) scale(1.15); }
        }
        @keyframes drift-2 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(-100px, -80px) scale(1.1); }
        }
        @keyframes drift-3 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(60px, -50px) scale(1.2); }
        }
        @keyframes drift-4 {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(-50px, 40px) scale(0.9); }
        }

        /* ===== GLASS CARDS (DARK) ===== */
        .glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(139, 92, 246, 0.15);
        }

        /* ===== NEON BUTTON ===== */
        .btn-neon {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-neon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-neon:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.4), 0 0 60px rgba(6, 182, 212, 0.2);
        }

        .btn-neon:hover::before {
            opacity: 1;
        }

        .btn-neon:active {
            transform: scale(0.98);
        }

        /* ===== NEON INPUT ===== */
        .input-dark {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            transition: all 0.3s ease;
        }

        .input-dark::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-dark:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15), 0 0 20px rgba(6, 182, 212, 0.1);
            background: rgba(255, 255, 255, 0.07);
            outline: none;
        }

        /* ===== NEON PROGRESS BAR ===== */
        .progress-neon {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-neon-bar {
            background: linear-gradient(90deg, #7c3aed, #06b6d4);
            border-radius: 999px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }

        .progress-neon-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        /* ===== STAT CARD ===== */
        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(139, 92, 246, 0.2);
            transform: translateY(-3px);
        }

        /* ===== TAB SYSTEM ===== */
        .tab-active {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), rgba(6, 182, 212, 0.3)) !important;
            border-color: rgba(139, 92, 246, 0.4) !important;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
        }

        .tab-inactive {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .tab-inactive:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* ===== ANIMATIONS ===== */
        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
            50% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.6); }
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== GRADIENT TEXT ===== */
        .gradient-text {
            background: linear-gradient(135deg, #8b5cf6, #06b6d4, #ec4899);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-text-shift 6s ease infinite;
        }

        @keyframes gradient-text-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .stat-number {
            background: linear-gradient(135deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.5), rgba(6, 182, 212, 0.5));
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.8), rgba(6, 182, 212, 0.8));
        }

        /* ===== DETAILS/ACCORDION DARK ===== */
        details.dark-accordion {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        details.dark-accordion summary {
            background: rgba(255, 255, 255, 0.03);
        }

        details.dark-accordion summary:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        /* ===== SELECT DARK ===== */
        .select-dark {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .select-dark:focus {
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
            outline: none;
        }

        .select-dark option {
            background: #1e293b;
            color: #e2e8f0;
        }

        /* ===== SUBTLE GRID PATTERN ===== */
        .grid-pattern {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ===== QUEUE CARD DARK ===== */
        .queue-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .queue-card:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        /* ===== CONTROL BUTTONS ===== */
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.2s ease;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* ===== BADGE ===== */
        .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .badge-speed {
            background: rgba(6, 182, 212, 0.15);
            color: #06b6d4;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        .badge-size {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-eta {
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        /* ===== NOISE TEXTURE ===== */
        .noise-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.015;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px;
        }
    </style>
</head>

<body>

    <!-- ===== AURORA BACKGROUND ===== -->
    <div class="aurora-container">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
        <div class="aurora-blob blob-3"></div>
        <div class="aurora-blob blob-4"></div>
    </div>
    <div class="noise-overlay"></div>

    <!-- ===== CUSTOM MODAL SYSTEM ===== -->
    <div id="customModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4"
        style="background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);">
        <div class="rounded-3xl p-8 max-w-md w-full relative overflow-hidden"
            style="background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(30px); border: 1px solid rgba(139, 92, 246, 0.3); box-shadow: 0 25px 70px rgba(0,0,0,0.8), 0 0 40px rgba(139, 92, 246, 0.1); animation: modalSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);">
            <div class="absolute inset-0 bg-gradient-to-br from-violet-500/5 to-cyan-500/5 pointer-events-none"></div>

            <div class="relative z-10">
                <div class="flex items-center gap-4 mb-6">
                    <div id="modalIcon"
                        class="w-14 h-14 rounded-2xl flex items-center justify-center text-3xl"
                        style="background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2)); border: 1px solid rgba(139, 92, 246, 0.2);">
                        <i class="fas fa-info-circle text-violet-400"></i>
                    </div>
                    <h3 id="modalTitle" class="text-2xl font-black text-white">Aviso</h3>
                </div>

                <div id="modalContent" class="text-white/80 mb-6 text-base leading-relaxed font-medium"></div>

                <div id="modalImage" class="hidden mb-6">
                    <div class="rounded-2xl p-3 flex gap-4 items-center"
                        style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);">
                        <img id="modalThumbnail" src="" class="w-28 h-20 object-cover rounded-xl" />
                        <h4 id="modalVideoTitle" class="text-white/90 text-sm font-bold flex-1"></h4>
                    </div>
                </div>

                <div class="flex gap-3 justify-end mt-8">
                    <button id="modalCancel" onclick="closeModal()"
                        class="hidden px-6 py-3 rounded-xl font-bold transition-all text-white/70 text-sm"
                        style="background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);"
                        onmouseover="this.style.background='rgba(255, 255, 255, 0.1)'"
                        onmouseout="this.style.background='rgba(255, 255, 255, 0.06)'">
                        Cancelar
                    </button>
                    <button id="modalConfirm" onclick="confirmModal()"
                        class="px-6 py-3 rounded-xl font-bold transition-all text-white text-sm shadow-2xl btn-neon">
                        Aceptar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="min-h-screen p-4 md:p-6 lg:p-8 relative z-10">

        <!-- ===== HEADER / HERO ===== -->
        <div class="glass rounded-3xl p-6 md:p-8 mb-6 relative overflow-hidden">
            <div class="absolute inset-0 grid-pattern opacity-30"></div>
            <div class="relative z-10">
                <!-- Logo Row -->
                <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center floating"
                            style="background: linear-gradient(135deg, #7c3aed, #06b6d4); box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);">
                            <i class="fas fa-bolt text-xl text-white"></i>
                        </div>
                        <div>
                            <h1 class="text-3xl md:text-4xl font-black gradient-text tracking-tight">
                                FluxDownloader <span class="text-lg font-bold text-white/40">Pro</span>
                            </h1>
                            <p class="text-white/30 text-xs font-medium tracking-wider uppercase mt-0.5">
                                Next Generation Media Manager
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== MAIN GRID (Bento) ===== -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- ===== LEFT COLUMN (2/3) ===== -->
            <div class="lg:col-span-2 space-y-6">

                <!-- URL Input Card -->
                <div class="glass rounded-3xl overflow-hidden fade-in">
                    <div class="p-6 md:p-8 space-y-5">

                        <!-- URL Input -->
                        <div class="relative">
                            <i class="fas fa-link absolute top-4 left-4 text-white/20"></i>
                            <input type="text" id="urlInput" placeholder="Pega aquí el link del video o playlist..."
                                class="input-dark w-full pl-11 pr-14 py-4 rounded-2xl text-sm font-medium" />
                            <button onclick="pasteFromClipboard()"
                                class="absolute top-2.5 right-3 p-2 text-white/30 hover:text-cyan-400 transition rounded-lg hover:bg-white/5"
                                title="Pegar del Portapapeles">
                                <i class="far fa-clipboard fa-lg"></i>
                            </button>
                        </div>

                        <!-- Cookie Management Section -->
                        <div class="rounded-2xl p-4"
                            style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);">
                            <div class="flex justify-between items-center mb-3">
                                <label id="cookieSourceLabel"
                                    class="text-xs font-bold text-white/60 flex items-center gap-2">
                                    <i class="fas fa-cookie-bite text-amber-400"></i> Cookies
                                </label>
                                <div id="cookieStatusBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full">
                                    <!-- Filled by JS -->
                                </div>
                            </div>

                            <div class="flex gap-2 items-center">
                                <!-- Upload cookies.txt -->
                                <label class="flex-1 cursor-pointer">
                                    <input type="file" id="cookieFileInput" accept=".txt" class="hidden" onchange="uploadCookiesFile(this)">
                                    <div class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold transition
                                        bg-gradient-to-r from-amber-500/10 to-amber-600/10 border border-amber-500/20 text-amber-300
                                        hover:from-amber-500/20 hover:to-amber-600/20 hover:border-amber-400/40">
                                        <i class="fas fa-upload"></i> Subir cookies.txt
                                    </div>
                                </label>
                                <!-- Delete cookies -->
                                <button id="deleteCookiesBtn" onclick="deleteCookies()" class="hidden p-2.5 rounded-xl text-xs font-bold transition
                                    bg-red-500/10 border border-red-500/20 text-red-400 hover:bg-red-500/20" title="Eliminar cookies">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>

                            <!-- Manual paste toggle -->
                            <button onclick="toggleManualMode()" class="mt-2 text-[10px] text-white/20 hover:text-cyan-400 flex items-center gap-1 transition uppercase tracking-wider font-semibold">
                                <i class="fas fa-cog"></i> Pegar cookies manualmente
                            </button>

                            <div id="manualCookiesArea" class="hidden mt-3 fade-in rounded-xl p-3"
                                style="background: rgba(251, 191, 36, 0.05); border: 1px solid rgba(251, 191, 36, 0.15);">
                                <label class="text-xs font-bold text-amber-400/80 mb-1 block">Modo Manual</label>
                                <textarea id="manualCookiesText" rows="3"
                                    class="input-dark w-full px-4 py-3 rounded-xl text-xs font-mono placeholder-white/20"
                                    placeholder="# Pegar contenido de cookies.txt aquí..."></textarea>
                            </div>

                            <!-- Hidden Audio Mode -->
                            <input type="checkbox" id="audioMode" class="hidden">
                        </div>

                        <!-- Analyze Button -->
                        <button onclick="analyzeVideo()" id="analyzeBtn"
                            class="btn-neon w-full text-white font-bold py-4 rounded-2xl flex justify-center items-center gap-3 text-sm uppercase tracking-wider">
                            <i class="fas fa-search"></i>
                            <span id="btnText">Analizar Enlace</span>
                            <svg id="btnSpinner" class="animate-spin h-5 w-5 text-white hidden"
                                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </button>

                        <!-- Error Message -->
                        <div id="errorMsg"
                            class="hidden p-4 rounded-2xl text-sm flex items-start gap-3"
                            style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);">
                            <i class="fas fa-exclamation-circle mt-0.5 text-red-400"></i>
                            <span id="errorText" class="text-red-300 flex-1">Error text</span>
                            <button onclick="this.parentElement.classList.add('hidden')"
                                class="text-red-400/50 hover:text-red-300"><i class="fas fa-times"></i></button>
                        </div>

                        <!-- ===== ANALYSIS RESULTS ===== -->
                        <div id="resultsArea" class="hidden fade-in pt-2">
                            <div class="rounded-2xl p-5" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);">
                                <div class="flex flex-col md:flex-row gap-5 mb-5">
                                    <div class="relative w-full md:w-44 shrink-0 group">
                                        <img id="vidThumb" src=""
                                            class="w-full h-28 object-cover rounded-xl bg-white/5" />
                                        <div class="absolute inset-0 bg-black/20 rounded-xl group-hover:bg-black/10 transition"></div>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <h2 id="vidTitle" class="text-lg font-bold text-white line-clamp-2 mb-2">Title</h2>
                                        <div class="flex items-center text-xs text-white/40 space-x-4">
                                            <span id="vidDuration" class="flex items-center"><i class="far fa-clock mr-1"></i> --:--</span>
                                            <a id="vidLink" href="#" target="_blank"
                                                class="flex items-center text-cyan-400/70 hover:text-cyan-300 transition">
                                                <i class="fas fa-external-link-alt mr-1"></i> Abrir Original
                                            </a>
                                        </div>
                                    </div>
                                </div>

                                <div id="formatsGrid"
                                    class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-60 overflow-y-auto pr-1">
                                    <!-- Format Buttons -->
                                </div>
                            </div>
                        </div>

                        <!-- ===== PLAYLIST AREA ===== -->
                        <div id="playlistArea" class="hidden fade-in space-y-4 pt-2">
                            <div class="flex justify-between items-center mb-2">
                                <h2 class="text-lg font-bold text-white">
                                    <i class="fas fa-list-ul mr-2 text-cyan-400"></i>Playlist Detectada
                                </h2>
                                <div class="space-x-3">
                                    <button onclick="toggleAllPlaylist(true)"
                                        class="text-xs text-cyan-400 font-semibold hover:text-cyan-300 transition">Marcar Todo</button>
                                    <button onclick="toggleAllPlaylist(false)"
                                        class="text-xs text-white/30 hover:text-white/50 transition">Desmarcar</button>
                                </div>
                            </div>

                            <div id="playlistGrid"
                                class="max-h-80 overflow-y-auto pr-1 space-y-2 rounded-2xl p-3"
                                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);">
                                <!-- Playlist Items -->
                            </div>

                            <button onclick="downloadSelectedPlaylist()"
                                class="w-full font-bold py-3 rounded-2xl shadow-lg transition flex justify-center items-center gap-2 text-sm text-white"
                                style="background: linear-gradient(135deg, #059669, #10b981); border: 1px solid rgba(255,255,255,0.1);">
                                <i class="fas fa-download"></i> Descargar Seleccionados
                            </button>
                        </div>

                        <!-- ===== DOWNLOAD QUEUE ===== -->
                        <div id="queueArea" class="space-y-4"></div>

                    </div>
                </div>

            </div>

            <!-- ===== RIGHT COLUMN (1/3) ===== -->
            <div>
                <div class="glass rounded-3xl overflow-hidden fade-in">
                    <!-- Panel Header -->
                    <div class="p-4" style="border-bottom: 1px solid rgba(255,255,255,0.06);">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-white/80 flex items-center gap-2">
                                <i class="fas fa-history text-cyan-400"></i>Historial <span id="history-count"
                                    class="text-xs opacity-50">(0)</span>
                            </h3>
                            <button onclick="loadHistory()" class="text-cyan-400/50 hover:text-cyan-400 text-xs transition">
                                <i class="fas fa-sync-alt"></i> Actualizar
                            </button>
                        </div>
                    </div>

                    <!-- History Content -->
                    <div id="history-content">
                        <div id="historyList" class="divide-y divide-white/5">
                            <p class="p-6 text-center text-white/20 text-sm">Cargando historial...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    </div>

    <!-- ===== ALL JAVASCRIPT (PRESERVED) ===== -->
    <script>
        let currentSessionId = null;
        let activeIntervals = {}; // Map: downloadId -> intervalId
        let currentMetadata = {};
        let historyData = []; // Store history globally for checking

        function toggleManualMode() {
            const currentMode = localStorage.getItem('cookieMode') || 'auto';
            const newMode = currentMode === 'auto' ? 'manual' : 'auto';

            // Update storage
            localStorage.setItem('cookieMode', newMode);

            // Update UI
            updateCookieUI(newMode);

            // Sync hidden radio for form submission
            const radio = document.querySelector(`input[name="cookieMode"][value="${newMode}"]`);
            if (radio) radio.checked = true;
        }

        function updateCookieUI(mode) {
            if (mode === 'manual') {
                document.getElementById('manualCookiesArea').classList.remove('hidden');
                document.getElementById('cookieSourceLabel').innerHTML = '<i class="fas fa-keyboard mr-1 text-amber-400"></i> Modo Manual';
            } else {
                document.getElementById('manualCookiesArea').classList.add('hidden');
                document.getElementById('cookieSourceLabel').innerHTML = '<i class="fas fa-cookie-bite mr-1 text-amber-400"></i> Cookies';
            }
        }

        // ===== COOKIE MANAGEMENT =====
        async function checkCookieStatus() {
            try {
                const res = await fetch('/api/cookies-status');
                const data = await res.json();
                const badge = document.getElementById('cookieStatusBadge');
                const deleteBtn = document.getElementById('deleteCookiesBtn');
                if (data.has_cookies) {
                    badge.innerHTML = `<span class="text-emerald-400">🟢 ${data.entries} cookies</span>`;
                    badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20';
                    deleteBtn.classList.remove('hidden');
                } else {
                    badge.innerHTML = '<span class="text-white/30">Sin cookies</span>';
                    badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/5 border border-white/10';
                    deleteBtn.classList.add('hidden');
                }
            } catch(e) { console.error('Cookie status check failed:', e); }
        }

        async function uploadCookiesFile(input) {
            if (!input.files.length) return;
            const formData = new FormData();
            formData.append('file', input.files[0]);
            try {
                const res = await fetch('/api/upload-cookies', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    await showAlert(`✅ Cookies cargadas (${data.entries} entradas)`);
                    checkCookieStatus();
                } else {
                    await showAlert(`❌ Error: ${data.error}`);
                }
            } catch(e) {
                await showAlert('❌ Error subiendo cookies');
            }
            input.value = ''; // Reset file input
        }

        async function deleteCookies() {
            try {
                await fetch('/api/cookies', { method: 'DELETE' });
                checkCookieStatus();
                await showAlert('🗑️ Cookies eliminadas');
            } catch(e) { console.error(e); }
        }

        // Check cookie status on load
        checkCookieStatus();

        function formatDuration(seconds) {
            if (!seconds) return '--:--';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.ceil(seconds % 60);
            return h > 0 ? `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}` : `${m}:${s.toString().padStart(2, '0')}`;
        }

        async function analyzeVideo() {
            const url = document.getElementById('urlInput').value.trim();
            let cookies = null;
            
            // Check if manual cookies are pasted
            const manualArea = document.getElementById('manualCookiesArea');
            if (!manualArea.classList.contains('hidden')) {
                cookies = document.getElementById('manualCookiesText').value.trim();
            }

            if (!url) return await showAlert("Ingresa una URL primero");

            // UI Reset
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('playlistArea').classList.add('hidden');

            const btn = document.getElementById('analyzeBtn');
            const spinner = document.getElementById('btnSpinner');
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            spinner.classList.remove('hidden');
            document.getElementById('btnText').textContent = "Procesando...";

            try {
                const res = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, cookies })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error);

                currentSessionId = data.session_id;

                if (data.cookie_warning) {
                    const errDiv = document.getElementById('errorMsg');
                    errDiv.classList.remove('hidden');
                    document.getElementById('errorText').innerHTML = "<b>Aviso:</b> No se pudieron leer las cookies (Navegador bloqueado). Resultados limitados.";
                }

                // --- PLAYLIST LOGIC ---
                if (data.type === 'playlist') {
                    renderPlaylist(data.entries);
                    document.getElementById('playlistArea').classList.remove('hidden');
                    return; // Stop here, don't show single video UI
                }

                // --- SINGLE VIDEO LOGIC ---
                currentMetadata = {
                    title: data.title,
                    thumbnail: data.thumbnail,
                    original_url: data.webpage_url || url,
                    uploader: data.uploader,
                    duration: data.duration
                };

                // Render Results
                document.getElementById('vidTitle').textContent = data.title;
                document.getElementById('vidThumb').src = data.thumbnail;
                document.getElementById('vidDuration').innerHTML = `<i class="far fa-clock mr-1"></i> ${formatDuration(data.duration)}`;
                document.getElementById('vidLink').href = data.webpage_url || url;

                renderSmartPresets(data.formats, url);

                document.getElementById('resultsArea').classList.remove('hidden');

            } catch (e) {
                document.getElementById('errorMsg').classList.remove('hidden');
                let msg = e.message;
                if (msg.includes('Failed to fetch')) {
                    msg = "Error de comunicación. Asegúrate de que la aplicación 'app.py' esté ejecutándose.";
                }
                document.getElementById('errorText').textContent = msg;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                spinner.classList.add('hidden');
                document.getElementById('btnText').textContent = "Analizar Enlace";
            }
        }

        async function checkAndStartDownload(formatId, url) {
            // Check duplicates
            const existing = historyData.find(h => h.original_url === url && h.status === 'completed');
            if (existing) {
                const date = new Date(existing.timestamp).toLocaleDateString();
                if (await showConfirm(`Ya descargaste este video el <b>${date}</b>.<br><br>¿Quieres descargarlo de nuevo?<br><span class="text-sm opacity-75">(Esto borrará el archivo anterior si existe)</span>`, "⚠️ Archivo Duplicado", { icon: "fa-exclamation-triangle", iconBg: "linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.2))", confirmText: "Re-descargar" })) {
                    startDownload(formatId, url, true); // Force = true
                }
                return;
            }
            startDownload(formatId, url, false);
        }

        async function startDownload(formatId, url, force = false) {
            // Hide results to allow new analysis
            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('urlInput').value = ''; // Clear input

            try {
                const res = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url, format_id: formatId,
                        session_id: currentSessionId,
                        metadata: { ...currentMetadata, mode: document.getElementById('audioMode').checked ? 'audio' : 'video' },
                        force: force
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                // Create Queue Item
                addQueueItem(data.download_id, currentMetadata);
                pollProgress(data.download_id);
                setTimeout(loadHistory, 1000);

            } catch (e) {
                await showAlert("Error descarga: " + e.message, "Error", "fa-times-circle", "linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.2))");
                document.getElementById('resultsArea').classList.remove('hidden');
            }
        }

        function addQueueItem(id, meta) {
            const el = document.createElement('div');
            el.id = `card-${id}`;
            el.className = "queue-card p-5 rounded-2xl fade-in relative overflow-hidden";
            el.innerHTML = `
                <div class="flex gap-4 mb-4">
                    <img src="${meta.thumbnail}" class="w-24 h-16 object-cover rounded-xl hidden sm:block bg-white/5">
                    <div class="flex-1 min-w-0">
                        <h3 class="font-bold text-white/90 truncate text-sm">${meta.title}</h3>
                        <p class="text-xs text-white/30 font-mono" id="filename-${id}">Preparando...</p>
                    </div>
                    <div class="flex flex-col items-end shrink-0 gap-3">
                        <div id="controls-${id}" class="flex gap-2">
                            <button onclick="pauseDownload('${id}')" class="ctrl-btn w-9 h-9 rounded-full flex items-center justify-center cursor-pointer" title="Pausar" type="button">
                                <i class="fas fa-pause text-xs"></i>
                            </button>
                            <button onclick="cancelDownload('${id}')" class="ctrl-btn w-9 h-9 rounded-full flex items-center justify-center cursor-pointer hover:!text-red-400 hover:!border-red-400/30" title="Cancelar" type="button">
                                <i class="fas fa-times text-xs"></i>
                            </button>
                        </div>
                        <span id="percent-${id}" class="text-xl font-black text-cyan-400 tracking-tight">0%</span>
                    </div>
                </div>

                <div class="progress-neon h-2.5 mb-4">
                    <div id="bar-${id}"
                        class="progress-neon-bar h-2.5"
                        style="width: 0%">
                    </div>
                </div>

                <div class="flex justify-between text-xs font-mono rounded-xl p-3" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.04);">
                    <div class="flex items-center gap-2">
                        <span class="badge badge-speed">VELOCIDAD</span>
                        <span id="speed-${id}" class="text-white/50">--</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="badge badge-size">TAMAÑO</span>
                        <span id="size-${id}" class="text-white/50">-- / --</span>
                    </div>
                    <div class="hidden sm:flex items-center gap-2">
                        <span class="badge badge-eta">FALTA</span>
                        <span id="remaining-${id}" class="text-white/50">--</span>
                    </div>
                </div>

                <!-- Post-Download Actions -->
                <div id="actions-${id}" class="hidden mt-4 flex justify-end gap-3 fade-in">
                    <button onclick="dismissCard('${id}')"
                        class="px-4 py-2.5 rounded-xl font-bold transition text-sm flex items-center gap-2 text-white/40 hover:text-red-400"
                        style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);">
                        <i class="fas fa-times"></i> Ocultar
                    </button>
                    <button onclick="saveToDisk('${id}')"
                        class="px-4 py-2.5 rounded-xl font-bold transition text-sm text-white flex items-center gap-2"
                        style="background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);">
                        <i class="fas fa-save"></i> Guardar en disco
                    </button>
                </div>
            `;
            // Insert at top
            const container = document.getElementById('queueArea');
            container.insertBefore(el, container.firstChild);
        }

        async function pollProgress(id) {
            if (activeIntervals[id]) clearInterval(activeIntervals[id]);

            let lastStatus = null; // Track local status to prevent DOM thrashing

            activeIntervals[id] = setInterval(async () => {
                try {
                    const res = await fetch(`/progress/${id}`);
                    if (res.status === 404) return;
                    const data = await res.json();

                    // Update UI elements scoped to ID
                    const setValid = (elId, val) => {
                        const el = document.getElementById(elId);
                        if (el) el.textContent = val;
                    };

                    setValid(`percent-${id}`, data.percent);
                    const bar = document.getElementById(`bar-${id}`);
                    if (bar) bar.style.width = data.percent;

                    setValid(`speed-${id}`, data.speed);
                    setValid(`size-${id}`, `${data.downloaded || '?'}`);
                    setValid(`remaining-${id}`, data.remaining || '--');
                    setValid(`filename-${id}`, data.filename || '...');
                    const titleEl = document.querySelector(`#card-${id} h3`);

                    const controls = document.getElementById(`controls-${id}`);

                    // ONLY update controls if status CHANGED
                    if (controls && data.status !== lastStatus) {
                        lastStatus = data.status;

                        if (data.status === 'processing' || data.status === 'downloading') {
                            if (titleEl) titleEl.textContent = "Procesando video...";
                            if (bar) {
                                bar.style.background = 'linear-gradient(90deg, #7c3aed, #06b6d4)';
                                bar.style.boxShadow = '0 0 15px rgba(6, 182, 212, 0.5)';
                            }
                            controls.innerHTML = `
                                    <button onclick="pauseDownload('${id}')" class="ctrl-btn w-9 h-9 rounded-full flex items-center justify-center cursor-pointer" title="Pausar" type="button"><i class="fas fa-pause text-xs"></i></button>
                                    <button onclick="cancelDownload('${id}')" class="ctrl-btn w-9 h-9 rounded-full flex items-center justify-center cursor-pointer hover:!text-red-400" title="Cancelar" type="button"><i class="fas fa-times text-xs"></i></button>
                                `;
                        } else if (data.status === 'paused') {
                            document.getElementById(`percent-${id}`).textContent = "PAUSADO";
                            if (bar) {
                                bar.style.background = 'linear-gradient(90deg, #f59e0b, #d97706)';
                                bar.style.boxShadow = '0 0 15px rgba(245, 158, 11, 0.4)';
                            }
                            controls.innerHTML = `
                                    <button onclick="resumeDownload('${id}')" class="ctrl-btn w-9 h-9 rounded-full flex items-center justify-center cursor-pointer hover:!text-emerald-400" title="Reanudar" type="button"><i class="fas fa-play text-xs"></i></button>
                                    <button onclick="cancelDownload('${id}')" class="ctrl-btn w-9 h-9 rounded-full flex items-center justify-center cursor-pointer hover:!text-red-400" title="Cancelar" type="button"><i class="fas fa-times text-xs"></i></button>
                                `;
                        } else if (data.status === 'finished') {
                            clearInterval(activeIntervals[id]);
                            delete activeIntervals[id];

                            if (titleEl) titleEl.textContent = "¡Descarga Completada!";
                            if (bar) {
                                bar.style.background = 'linear-gradient(90deg, #059669, #10b981)';
                                bar.style.boxShadow = '0 0 20px rgba(16, 185, 129, 0.4)';
                                bar.style.animation = 'none';
                            }
                            controls.classList.add('hidden');

                            // === AUTO-DOWNLOAD: trigger file download to user's device ===
                            const actions = document.getElementById(`actions-${id}`);
                            if (actions) {
                                actions.classList.remove('hidden');
                                actions.innerHTML = `
                                    <a href="/download_file/${id}" class="px-4 py-2 rounded-xl text-xs font-bold transition
                                        bg-gradient-to-r from-emerald-500/20 to-cyan-500/20 border border-emerald-500/30 text-emerald-300
                                        hover:from-emerald-500/30 hover:to-cyan-500/30 flex items-center gap-2" download>
                                        <i class="fas fa-download"></i> Descargar al Dispositivo
                                    </a>
                                    <button onclick="this.closest('.queue-card').remove()" class="px-3 py-2 rounded-xl text-xs font-bold
                                        bg-white/5 border border-white/10 text-white/40 hover:text-white/60 transition">
                                        <i class="fas fa-times"></i> Cerrar
                                    </button>
                                `;
                            }
                            // Auto-trigger download to device
                            window.location.href = `/download_file/${id}`;
                            loadHistory();
                        } else if (data.status === 'error') {
                            clearInterval(activeIntervals[id]);
                            delete activeIntervals[id];
                            if (titleEl) titleEl.textContent = "Error: " + data.error;
                            if (bar) {
                                bar.style.background = 'linear-gradient(90deg, #ef4444, #dc2626)';
                                bar.style.boxShadow = '0 0 15px rgba(239, 68, 68, 0.4)';
                            }
                            controls.classList.add('hidden');
                        }
                    }

                } catch (e) {
                    console.error(e);
                }
            }, 800);
        }

        function saveToDisk(id) {
            if (id) {
                window.location.href = `/download_file/${id}`;
            }
        }

        function dismissCard(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.95)';
                setTimeout(() => card.remove(), 300);
            }
            if (activeIntervals[id]) {
                clearInterval(activeIntervals[id]);
                delete activeIntervals[id];
            }
        }

        async function loadHistory() {
            const list = document.getElementById('historyList');
            try {
                const res = await fetch('/history');
                historyData = await res.json();

                // Update counter
                document.getElementById('history-count').textContent = `(${historyData.length})`;

                if (historyData.length === 0) {
                    list.innerHTML = '<div class="p-8 text-center text-white/20 text-sm">No hay descargas recientes</div>';
                    return;
                }

                // Group by Uploader (Folder)
                const folders = {};
                historyData.forEach(item => {
                    const uploader = item.uploader || 'Desconocido';
                    if (!folders[uploader]) folders[uploader] = [];
                    folders[uploader].push(item);
                });

                // Render Accordions
                list.innerHTML = Object.entries(folders).map(([uploader, items]) => `
                        <details class="dark-accordion group mb-2 rounded-xl overflow-hidden" open>
                            <summary class="flex justify-between items-center p-3 cursor-pointer transition select-none">
                                <div class="flex items-center gap-2 font-bold text-white/80 w-full text-sm">
                                    <i class="far fa-folder-open text-amber-400/70"></i>
                                    <span>${uploader}</span>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full font-bold" style="background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4);">${items.length}</span>
                                </div>
                                <i class="fas fa-chevron-down text-white/20 transition-transform group-open:rotate-180 text-xs"></i>
                            </summary>
                            <div class="p-2" style="border-top: 1px solid rgba(255,255,255,0.04);">
                                ${items.map(item => `
                                    <div class="p-3 mb-1 flex flex-col sm:flex-row sm:items-center gap-3 rounded-xl transition group/item hover:bg-white/[0.03]">
                                        <div class="relative w-full sm:w-20 shrink-0">
                                            <img src="${item.thumbnail}" class="w-full h-14 object-cover rounded-lg bg-white/5" onerror="this.src='https://via.placeholder.com/80?text=Video'">
                                            <span class="absolute bottom-0 right-0 bg-black/80 text-white/70 text-[8px] px-1 rounded-tl font-mono">${formatDuration(item.duration)}</span>
                                        </div>
                                        
                                        <div class="flex-1 min-w-0">
                                            <h4 title="${(item.title || '').replace(/"/g, '&quot;')}" class="font-bold text-white text-xs line-clamp-2">${item.title}</h4>
                                            <div class="text-[10px] text-white/50 flex flex-wrap items-center gap-x-2 mt-1">
                                                ${item.status === 'expired' ? '<span class="text-amber-400/80 font-semibold">⌛ Expirado</span>' :
                                                  item.status === 'completed' || item.status === 'served' ? '<span class="text-emerald-400/80 font-semibold">✓ Completado</span>' :
                                                  item.status === 'processing' || item.status === 'downloading' ? '<span class="text-cyan-400/80 font-semibold">⏳ En proceso</span>' :
                                                  '<span class="text-white/40">' + (item.status || 'Desconocido') + '</span>'}
                                                <span>• ${item.timestamp ? new Date(item.timestamp).toLocaleDateString() : ''}</span>
                                            </div>
                                        </div>

                                        <div class="flex items-center gap-1 opacity-100 sm:opacity-0 sm:group-hover/item:opacity-100 transition justify-end">
                                            <a href="${item.original_url}" target="_blank" class="p-1.5 text-white/20 hover:text-cyan-400 transition" title="Ver Original"><i class="fas fa-external-link-alt text-xs"></i></a>
                                            <button onclick="document.getElementById('urlInput').value = '${item.original_url.replace(/'/g, "\\'")}'; document.getElementById('analyzeBtn').click();" class="p-1.5 text-white/20 hover:text-emerald-400 transition" title="Volver a Descargar"><i class="fas fa-download text-xs"></i></button>
                                            <button onclick="deleteHistory('${item.download_id}')" class="p-1.5 text-white/20 hover:text-red-400 transition" title="Eliminar del Historial"><i class="far fa-trash-alt text-xs"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </details>
                    `).join('');



            } catch (e) {
                console.error("History error", e);
            }
        }

        // Tab switching function (simplified - only history now)
        function showTab(tabName) {
            loadHistory();
        }


        async function deleteHistory(id) {
            if (!await showConfirm("¿Estás seguro de que quieres eliminar este video del historial?", "Eliminar Historial", { icon: "fa-trash-alt", iconBg: "linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.2))", confirmText: "Eliminar" })) return;
            await fetch(`/history/${id}`, { method: 'DELETE' });
            loadHistory();
        }

        async function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            await showAlert("Link copiado!");
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('urlInput').value = text;
                }
            } catch (err) {
                await showAlert("Permiso denegado para leer portapapeles. ¡Pégalo manualmente!");
            }
        }

        function renderSmartPresets(formats, url) {
            const grid = document.getElementById('formatsGrid');
            grid.innerHTML = '';
            grid.className = "grid grid-cols-1 gap-3";

            if (!formats || formats.length === 0) {
                grid.innerHTML = `
                        <div class="p-4 rounded-2xl text-sm" style="background: rgba(251, 191, 36, 0.06); border: 1px solid rgba(251, 191, 36, 0.15);">
                            <h3 class="font-bold text-amber-400"><i class="fas fa-exclamation-triangle"></i> No se encontraron formatos de video</h3>
                            <p class="text-sm mt-2 text-white/50">
                                <strong class="text-white/70">Cómo solucionar el "Navegador Bloqueado":</strong>
                                <ul class="list-disc ml-5 mt-1 space-y-1">
                                    <li><strong>Opción 1 (Rápida):</strong> Busca el icono de Brave 🦁 en la <b>bandeja del sistema</b>, dale click derecho y elige <b>"Exit"</b>. Luego vuelve a probar aqui.</li>
                                    <li><strong>Opción 2 (Segura):</strong> Usa el <a href="#" onclick="toggleManualMode(); return false;" class="text-cyan-400 underline font-bold">Modo Manual</a>.</li>
                                </ul>
                            </p>
                            
                             <button onclick="document.getElementById('audioMode').checked = true; checkAndStartDownload('best', '${url}')" 
                                class="mt-3 w-full font-bold py-2.5 rounded-xl text-white text-sm transition"
                                style="background: linear-gradient(135deg, #7c3aed, #6d28d9);">
                                <i class="fas fa-music"></i> Intentar descargar Audio
                            </button>
                        </div>
                     `;
                return;
            }

            // Find Best Video
            const bestVideo = formats.find(f => f.resolution.includes('2160') || f.resolution.includes('1440') || f.resolution.includes('1080')) || formats[0];

            // Find Mobile/Data Saver (720p or 480p)
            const economy = formats.find(f => f.resolution.includes('480') || f.resolution.includes('360')) || formats[formats.length - 1];

            const cards = [
                {
                    title: "🌟 Máxima Calidad",
                    desc: `Video ${bestVideo.resolution} (MP4) • Ideal para TV/PC`,
                    icon: "fas fa-crown text-amber-400",
                    color: "hover:border-amber-500/30",
                    bgHover: "hover:bg-amber-500/5",
                    action: () => checkAndStartDownload(bestVideo.id, url)
                },
                {
                    title: "📱 Ahorro de Datos",
                    desc: `Video ${economy.resolution} (MP4) • Ligero para Móvil`,
                    icon: "fas fa-mobile-alt text-emerald-400",
                    color: "hover:border-emerald-500/30",
                    bgHover: "hover:bg-emerald-500/5",
                    action: () => checkAndStartDownload(economy.id, url)
                },
                {
                    title: "🎵 Solo Audio",
                    desc: "Extraer MP3 (Alta Calidad) • Sin Video",
                    icon: "fas fa-music text-violet-400",
                    color: "hover:border-violet-500/30",
                    bgHover: "hover:bg-violet-500/5",
                    action: () => {
                        document.getElementById('audioMode').checked = true;
                        checkAndStartDownload(bestVideo.id, url);
                    }
                },
                {
                    title: "⚙️ Avanzado",
                    desc: "Elegir formato manualmente",
                    icon: "fas fa-cogs text-white/40",
                    color: "hover:border-white/15",
                    bgHover: "hover:bg-white/[0.03]",
                    action: () => renderFullList(formats, url)
                }
            ];

            cards.forEach(card => {
                const el = document.createElement('div');
                el.className = `p-4 rounded-xl cursor-pointer transition-all flex items-center gap-4 group ${card.color} ${card.bgHover}`;
                el.style.cssText = 'background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);';
                el.onclick = card.action;
                el.innerHTML = `
                    <div class="w-11 h-11 rounded-xl flex items-center justify-center text-lg shrink-0" style="background: rgba(255,255,255,0.05);">
                        <i class="${card.icon}"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-white/90 text-sm">${card.title}</h4>
                        <p class="text-[11px] text-white/30 uppercase font-semibold tracking-wide">${card.desc}</p>
                    </div>
                    <i class="fas fa-chevron-right ml-auto text-white/10 group-hover:text-white/30 transition"></i>
                `;
                grid.appendChild(el);
            });
        }

        function renderFullList(formats, url) {
            const grid = document.getElementById('formatsGrid');
            grid.innerHTML = '';

            // Back Button
            const backBtn = document.createElement('button');
            backBtn.className = "col-span-1 sm:col-span-2 mb-2 text-white/30 hover:text-cyan-400 text-xs font-bold flex items-center gap-2 transition";
            backBtn.onclick = () => renderSmartPresets(formats, url);
            backBtn.innerHTML = `<i class="fas fa-arrow-left"></i> Volver a Presets Inteligentes`;
            grid.appendChild(backBtn);

            grid.className = "grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-80 overflow-y-auto pr-1";

            formats.forEach(fmt => {
                const el = document.createElement('button');
                el.className = "flex justify-between items-center p-3 rounded-xl transition text-left group";
                el.style.cssText = 'background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);';
                el.onmouseover = function() { this.style.borderColor = 'rgba(6, 182, 212, 0.3)'; this.style.background = 'rgba(6, 182, 212, 0.05)'; };
                el.onmouseout = function() { this.style.borderColor = 'rgba(255,255,255,0.06)'; this.style.background = 'rgba(255,255,255,0.03)'; };
                el.onclick = () => checkAndStartDownload(fmt.id, url);
                el.innerHTML = `
                    <div>
                        <span class="block font-bold text-white/80 text-sm group-hover:text-cyan-300 transition">video ${fmt.resolution}</span>
                        <span class="text-[11px] text-white/30">${fmt.ext} ${fmt.note || ''}</span>
                    </div>
                    <span class="text-xs font-semibold px-2 py-1 rounded-lg" style="background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5);">${fmt.size}</span>
                `;
                grid.appendChild(el);
            });
        }

        function renderPlaylist(entries) {
            const grid = document.getElementById('playlistGrid');
            grid.innerHTML = '';

            entries.forEach((entry, idx) => {
                const el = document.createElement('div');
                el.className = "flex items-center gap-3 p-3 rounded-xl transition";
                el.style.cssText = 'background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);';
                el.innerHTML = `
                    <input type="checkbox" id="pl-${entry.id}" value="${entry.url}" checked 
                        data-title="${entry.title}" data-thumb="${entry.thumbnail}" data-dur="${entry.duration}"
                        class="w-4 h-4 rounded cursor-pointer accent-cyan-500">
                    
                    <img src="${entry.thumbnail}" class="w-14 h-9 object-cover rounded-lg bg-white/5">
                    
                    <div class="flex-1 min-w-0">
                         <label for="pl-${entry.id}" class="block text-xs font-semibold text-white/80 truncate cursor-pointer select-none">${entry.title}</label>
                         <span class="text-[10px] text-white/30 capitalize">${entry.uploader || 'Unknown'} • ${formatDuration(entry.duration)}</span>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        function toggleAllPlaylist(state) {
            document.querySelectorAll('#playlistGrid input[type="checkbox"]').forEach(cb => cb.checked = state);
        }

        async function downloadSelectedPlaylist() {
            const checkboxes = document.querySelectorAll('#playlistGrid input[type="checkbox"]:checked');
            if (checkboxes.length === 0) return await showAlert("Selecciona al menos un video.");

            const mode = document.getElementById('audioMode').checked ? 'audio' : 'video';
            const count = checkboxes.length;

            if (!confirm(`¿Iniciar descarga de ${count} videos en modo ${mode.toUpperCase()}?`)) return;

            // Hide UI to cleanup
            document.getElementById('playlistArea').classList.add('hidden');
            document.getElementById('urlInput').value = '';

            for (const cb of checkboxes) {
                const url = cb.value;
                const meta = {
                    title: cb.dataset.title,
                    thumbnail: cb.dataset.thumb,
                    duration: parseInt(cb.dataset.dur || 0),
                    original_url: url
                };

                try {
                    const res = await fetch('/download', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            url: url,
                            format_id: 'bestvideo',
                            session_id: currentSessionId,
                            metadata: { ...meta, mode: mode },
                            browser: document.getElementById('browserSelect').value,
                            force: false
                        })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        addQueueItem(data.download_id, meta);
                        pollProgress(data.download_id);
                    }
                } catch (e) {
                    console.error("Skipped playlist item", e);
                }

                await new Promise(r => setTimeout(r, 500));
            }
            setTimeout(loadHistory, 1000);
        }

        async function pauseDownload(id) {
            await fetch(`/pause/${id}`, { method: 'POST' });
        }

        async function resumeDownload(id) {
            const item = document.getElementById(`queue-${id}`);
            if (!item) return;
            await showAlert("Para reanudar, vuelve a analizar y descargar el video. El sistema detectará los archivos parciales.");
        }

        async function cancelDownload(id) {
            if (await showConfirm("¿Estás seguro de cancelar esta descarga?", "⚠️ Cancelar Descarga", { icon: "fa-times-circle", iconBg: "linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(220, 38, 38, 0.2))" })) {
                pauseDownload(id);
                document.getElementById(`queue-${id}`).remove();
            }
        }

        // ===== INIT PREFERENCES =====
        (function initPreferences() {
            const savedMode = localStorage.getItem('cookieMode') || 'auto';

            updateCookieUI(savedMode);
            const radio = document.querySelector(`input[name="cookieMode"][value="${savedMode}"]`);
            if (radio) radio.checked = true;

            // Load history on page init
            loadHistory();
        })();




        // ==================== CUSTOM MODAL SYSTEM ====================
        let modalResolve = null;

        function showAlert(message, title = '⚠️ Aviso', icon = 'fa-exclamation-circle', iconBg = 'linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.15))') {
            const modal = document.getElementById('customModal');
            if (!modal) return Promise.resolve();
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const modalIcon = document.getElementById('modalIcon');
            const modalImage = document.getElementById('modalImage');
            const modalCancel = document.getElementById('modalCancel');

            modalImage.classList.add('hidden');
            modalCancel.classList.add('hidden');

            modalTitle.textContent = title;
            modalContent.innerHTML = message;
            modalIcon.style.background = iconBg;
            modalIcon.innerHTML = `<i class="fas ${icon} text-white/80"></i>`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            return new Promise(resolve => { modalResolve = resolve; });
        }

        function showConfirm(message, title = '❓ Confirmación', options = {}) {
            const modal = document.getElementById('customModal');
            if (!modal) return Promise.resolve(false);
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const modalIcon = document.getElementById('modalIcon');
            const modalImage = document.getElementById('modalImage');
            const modalCancel = document.getElementById('modalCancel');
            const modalThumbnail = document.getElementById('modalThumbnail');
            const modalVideoTitle = document.getElementById('modalVideoTitle');

            modalCancel.classList.remove('hidden');

            modalTitle.textContent = title;
            modalContent.innerHTML = message;
            modalIcon.style.background = options.iconBg || 'linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2))';
            modalIcon.innerHTML = `<i class="fas ${options.icon || 'fa-question-circle'} text-white/80"></i>`;

            if (options.thumbnail && options.videoTitle) {
                modalImage.classList.remove('hidden');
                modalThumbnail.src = options.thumbnail;
                modalVideoTitle.textContent = options.videoTitle;
            } else {
                modalImage.classList.add('hidden');
            }

            document.getElementById('modalConfirm').textContent = options.confirmText || 'Aceptar';
            modalCancel.textContent = options.cancelText || 'Cancelar';

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            return new Promise(resolve => { modalResolve = resolve; });
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            if (modalResolve) {
                modalResolve(false);
                modalResolve = null;
            }
        }

        function confirmModal() {
            const modal = document.getElementById('customModal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            if (modalResolve) {
                modalResolve(true);
                modalResolve = null;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        const modalEl = document.getElementById('customModal');
        if (modalEl) {
            modalEl.addEventListener('click', (e) => {
                if (e.target.id === 'customModal') closeModal();
            });
        }

    </script>
