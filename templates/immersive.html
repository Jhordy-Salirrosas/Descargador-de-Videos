<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxDownloader - Immersive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Parallax Background */
        #parallax-bg {
            transition: transform 0.1s ease-out;
        }

        /* Glassmorphism */
        .cyber-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .cyber-input {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(6, 182, 212, 0.3);
            transition: all 0.3s ease;
        }

        .cyber-input:focus {
            outline: none;
            border-color: rgba(6, 182, 212, 0.8);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        }

        .cyber-button {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.9), rgba(168, 85, 247, 0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .cyber-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(6, 182, 212, 0.4);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.8), rgba(168, 85, 247, 0.8));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #22d3ee 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Pulse Glow Animation */
        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(6, 182, 212, 0.3), 0 0 40px rgba(168, 85, 247, 0.2);
            }

            50% {
                box-shadow: 0 0 30px rgba(6, 182, 212, 0.5), 0 0 60px rgba(168, 85, 247, 0.3);
            }
        }

        .animate-pulse-glow {
            animation: pulse-glow 3s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.7);
            border-radius: 10px;
            border: 2px solid rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.9);
        }

        /* Smooth scroll */
        .tab-content {
            scroll-behavior: smooth;
        }

        :root {
            --fd-bg: #070b14;
            --fd-bg-soft: #0b1220;
            --fd-paper: rgba(12, 20, 35, 0.82);
            --fd-paper-strong: rgba(16, 28, 46, 0.88);
            --fd-border: rgba(88, 141, 214, 0.35);
            --fd-ink: #e9f2ff;
            --fd-muted: #9fb1ca;
            --fd-brand: #1fa5ff;
            --fd-brand-2: #10b981;
            --fd-warm: #f4b452;
            --fd-shadow: 0 20px 50px rgba(1, 7, 19, 0.52);
            --custom-card-alpha: 0.76;
            --custom-pane-alpha: 0.62;
            --custom-input-alpha: 0.64;
            --custom-tab-alpha: 0.55;
        }

        body {
            color: var(--fd-ink);
            background:
                radial-gradient(1200px 600px at -10% -20%, rgba(16, 185, 129, 0.14), transparent 48%),
                radial-gradient(900px 560px at 110% 0%, rgba(244, 180, 82, 0.16), transparent 44%),
                linear-gradient(160deg, var(--fd-bg) 0%, #0b1220 48%, #0f1b32 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-image: radial-gradient(rgba(138, 177, 230, 0.22) 1px, transparent 1px);
            background-size: 22px 22px;
            opacity: 0.2;
            mask-image: radial-gradient(circle at center, black 40%, transparent 92%);
        }

        #parallax-bg {
            opacity: 0.4;
        }

        #parallax-bg img,
        #parallax-bg video {
            filter: grayscale(0.05) sepia(0.08) brightness(0.58) contrast(1.1);
            mix-blend-mode: screen;
        }

        body.custom-bg #parallax-bg {
            opacity: 1;
        }

        body.custom-bg #parallax-bg img,
        body.custom-bg #parallax-bg video {
            mix-blend-mode: normal;
        }

        .workspace-shell {
            max-width: 1450px;
            margin: 0 auto;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: minmax(360px, 0.92fr) minmax(500px, 1.08fr);
            gap: 1.1rem;
        }

        .cyber-card {
            background: linear-gradient(160deg, var(--fd-paper), var(--fd-paper-strong)) !important;
            border: 1px solid var(--fd-border) !important;
            box-shadow: var(--fd-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .cyber-input {
            background: rgba(8, 15, 28, 0.88) !important;
            border: 1px solid rgba(75, 143, 228, 0.45) !important;
            color: var(--fd-ink) !important;
        }

        .cyber-input::placeholder {
            color: #91a8c6 !important;
        }

        .cyber-input:focus {
            border-color: rgba(244, 180, 82, 0.8) !important;
            box-shadow: 0 0 0 3px rgba(244, 180, 82, 0.2), 0 8px 18px rgba(14, 64, 124, 0.4) !important;
        }

        .cyber-button,
        .glass-button {
            background: linear-gradient(120deg, var(--fd-brand), #2e7bd4 52%, var(--fd-brand-2) 100%) !important;
            border: 1px solid rgba(13, 141, 219, 0.25) !important;
            box-shadow: 0 12px 24px rgba(13, 141, 219, 0.28) !important;
            color: #ffffff !important;
        }

        .workspace-shell .text-white {
            color: #e9f2ff !important;
        }

        .workspace-shell .text-white\/70,
        .workspace-shell .text-white\/60,
        .workspace-shell .text-white\/50,
        .workspace-shell .text-white\/40 {
            color: #9fb1ca !important;
        }

        .workspace-shell .cyber-button.text-white,
        .workspace-shell .glass-button.text-white,
        .workspace-shell .tab-btn.glass-button.text-white {
            color: #ffffff !important;
        }

        .cyber-button:hover,
        .glass-button:hover {
            transform: translateY(-2px);
            filter: saturate(1.05);
            box-shadow: 0 16px 28px rgba(13, 141, 219, 0.34) !important;
        }

        .brand-title {
            font-family: 'Sora', 'Manrope', sans-serif;
            font-weight: 800;
            letter-spacing: -0.035em;
            color: #eff6ff;
            text-shadow: none !important;
        }

        .brand-gradient {
            color: #66d2ff;
        }

        @supports (-webkit-background-clip: text) {
            .brand-gradient {
                background: linear-gradient(120deg, #66d2ff 0%, #1fa5ff 45%, #f4b452 100%) !important;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
        }

        .tab-btn {
            border: 1px solid rgba(19, 33, 54, 0.14) !important;
            color: #c9d9ef !important;
            background: rgba(10, 18, 33, 0.78) !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .tab-btn.glass-button {
            color: #ffffff !important;
            background: linear-gradient(120deg, #0d8ddb, #126dc2) !important;
        }

        #downloadsList .bg-white\/10,
        #historyList .bg-white\/10,
        #downloadsList .bg-slate-800\/60,
        #historyList .bg-slate-800\/60 {
            background: rgba(12, 22, 39, 0.88) !important;
            border: 1px solid rgba(98, 146, 219, 0.22) !important;
            color: #e5f0ff !important;
        }

        #downloads-content,
        #history-content {
            background: linear-gradient(180deg, rgba(9, 18, 34, 0.64), rgba(10, 22, 38, 0.45));
            border: 1px solid rgba(98, 146, 219, 0.2);
            border-radius: 14px;
            padding: 0.45rem;
        }

        .animate-pulse-glow {
            animation: none;
        }

        .panel-enter {
            opacity: 0;
            transform: translateY(16px) scale(0.99);
            animation: panel-enter 560ms cubic-bezier(0.2, 0.85, 0.2, 1) forwards;
        }

        .panel-delay-1 {
            animation-delay: 120ms;
        }

        .panel-delay-2 {
            animation-delay: 220ms;
        }

        @keyframes panel-enter {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        #customModal>div,
        #bgSettingsModal>div {
            background: linear-gradient(160deg, rgba(255, 252, 244, 0.96), rgba(255, 255, 255, 0.94)) !important;
            border: 1px solid rgba(19, 33, 54, 0.14) !important;

        #customModal .text-white,

        }

        #customModal .text-white\/95,
        #bgSettingsModal .text-white\/50,

        }

        @media (max-width: 1180px) {
            .workspace-grid {
                grid-template-columns: 1fr;
                gap: 0.9rem;
            }

            .min-h-screen.h-screen {
                height: auto;
                min-height: 100vh;
            }

            .workspace-shell {
                padding-left: 0.6rem;
                padding-right: 0.6rem;
            }

        @media (max-width: 640px) {

                margin-bottom: 0.7rem;

            }

            .cyber-card.rounded-2xl {
                border-radius: 1rem;
                padding: 0.95rem;
            }

            .fixed.top-6.right-6 {
                top: 0.55rem;
                right: 0.55rem;
            }

    <!-- Particles & Parallax Scripts -->
    <script>
        // ==================== PARALLAX EFFECT ====================
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            const bg = document.getElementById('parallax-bg');
            if (bg) {
                bg.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

        // ==================== PARTICLE SYSTEM ====================
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 80;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(6, 182, 212, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        initParticles();
        animateParticles();
    </script>

        function formatDuration(seconds) {
            if (!seconds) return '--:--';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.ceil(seconds % 60);
            return h > 0 ? `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}` : `${m}:${s.toString().padStart(2, '0')}`;
        }

        async function analyzeVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const mode = document.querySelector('input[name="cookieMode"]:checked').value;
            let cookies = null;
            let browser = null;

            if (mode === 'manual') {
                cookies = document.getElementById('manualCookiesText').value.trim();
                if (!cookies) return await showAlert("⚠️ El campo de cookies está vacío. Por favor pega las cookies exportadas.");
            } else {
                browser = document.getElementById('browserSelect').value;
            }

            if (!url) return await showAlert("Ingresa una URL primero");

            // UI Reset
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('playlistArea').classList.add('hidden');

            const btn = document.getElementById('analyzeBtn');
            const spinner = document.getElementById('btnSpinner');
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            spinner.classList.remove('hidden');
            document.getElementById('btnText').textContent = "Procesando...";

            try {
                const res = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, cookies, browser })
                });
                const responseText = await res.text();
                let data = null;
                try {
                    data = responseText ? JSON.parse(responseText) : {};
                } catch {
                    data = { error: responseText };
                }

                if (!res.ok) {
                    const fallback = `Error ${res.status} en /analyze`;
                    const raw = (data && data.error) ? String(data.error) : fallback;
                    // Avoid dumping full HTML pages in UI while still surfacing backend failure.
                    const clean = raw.includes('<!doctype') || raw.includes('<html')
                        ? `${fallback}. El backend devolvió una página de error (revisa logs del servidor).`
                        : raw;
                    throw new Error(clean);
                }

                currentSessionId = data.session_id;

                if (data.cookie_warning) {
                    const errDiv = document.getElementById('errorMsg');
                    errDiv.classList.remove('hidden');
                    document.getElementById('errorText').innerHTML = "<b>Aviso:</b> No se pudieron leer las cookies (Navegador bloqueado). Resultados limitados.";
                }

                // --- PLAYLIST LOGIC ---
                if (data.type === 'playlist') {
                    renderPlaylist(data.entries);
                    document.getElementById('playlistArea').classList.remove('hidden');
                    return;
                }

                // --- SINGLE VIDEO LOGIC ---
                currentMetadata = {
                    title: data.title,
                    thumbnail: data.thumbnail,
                    original_url: data.webpage_url || url,
                    uploader: data.uploader,
                    duration: data.duration
                };

                // Render Results
                document.getElementById('vidTitle').textContent = data.title;
                document.getElementById('vidThumb').src = data.thumbnail;
                document.getElementById('vidDuration').innerHTML = `<i class="far fa-clock mr-1"></i> ${formatDuration(data.duration)}`;
                document.getElementById('vidLink').href = data.webpage_url || url;

                renderSmartPresets(data.formats, url);

                document.getElementById('resultsArea').classList.remove('hidden');

            } catch (e) {
                document.getElementById('errorMsg').classList.remove('hidden');
                let msg = e.message;
                if (msg.includes('Failed to fetch')) {
                    msg = "Error de comunicación. Asegúrate de que la aplicación 'app.py' esté ejecutándose.";
                }
                document.getElementById('errorText').textContent = msg;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                spinner.classList.add('hidden');
                document.getElementById('btnText').textContent = "Analizar Enlace";
            }
        }

        async function checkAndStartDownload(formatId, url) {
            const existing = historyData.find(h => h.original_url === url && h.status === 'completed');
            if (existing) {
                const date = new Date(existing.timestamp).toLocaleDateString();
                if (await showConfirm(`Ya descargaste este video el <b>${date}</b>.<br><br>¿Quieres descargarlo de nuevo?<br><span class="text-sm opacity-75">(Esto borrará el archivo anterior si existe)</span>`, "⚠️ Archivo Duplicado", { icon: "fa-exclamation-triangle", iconBg: "linear-gradient(135deg, #f59e0b, #d97706)", confirmText: "Re-descargar" })) {
                    startDownload(formatId, url, true);
                }
                return;
            }
            startDownload(formatId, url, false);
        }

        async function startDownload(formatId, url, force = false) {
            const mode = document.querySelector('input[name="cookieMode"]:checked').value;
            let browser = null;
            if (mode === 'auto') browser = document.getElementById('browserSelect').value;

            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('urlInput').value = '';

            try {
                const res = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url, format_id: formatId,
                        session_id: currentSessionId,
                        metadata: { ...currentMetadata, mode: document.getElementById('audioMode').checked ? 'audio' : 'video' },
                        browser: browser,
                        force: force
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                addQueueItem(data.download_id, currentMetadata);
                pollProgress(data.download_id);
                setTimeout(loadHistory, 1000);

            } catch (e) {
                await showAlert("Error descarga: " + e.message, "Error", "fa-times-circle", "linear-gradient(135deg, #ef4444, #b91c1c)");
                document.getElementById('resultsArea').classList.remove('hidden');

        }

        async function pollProgress(id) {
            if (activeIntervals[id]) clearInterval(activeIntervals[id]);

            let lastStatus = null;

            activeIntervals[id] = setInterval(async () => {
                try {
                    const res = await fetch(`/progress/${id}`);
                    if (res.status === 404) return;
                    const data = await res.json();

                    const setValid = (elId, val) => {
                        const el = document.getElementById(elId);
                        if (el) el.textContent = val;
                    };

                    setValid(`percent-${id}`, data.percent);
                    const bar = document.getElementById(`bar-${id}`);
                    if (bar) bar.style.width = data.percent;

                    setValid(`speed-${id}`, data.speed);
                    setValid(`size-${id}`, `${data.downloaded || '?'}`);
                    setValid(`remaining-${id}`, data.remaining || '--');
                    setValid(`filename-${id}`, data.filename || '...');
                    const titleEl = document.querySelector(`#card-${id} h3`);

                    const controls = document.getElementById(`controls-${id}`);

                    if (controls && data.status !== lastStatus) {
                        lastStatus = data.status;

                        if (data.status === 'processing' || data.status === 'downloading') {
                            if (titleEl) titleEl.textContent = "Procesando video...";
                            if (bar) {
                                bar.classList.add('animate-pulse');
                                bar.classList.remove('bg-yellow-500', 'bg-red-500');
                                bar.classList.add('bg-blue-500');
                            }
                            controls.innerHTML = `
                                    <button onclick="pauseDownload('${id}')" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 hover:bg-yellow-100 hover:text-yellow-600 transition flex items-center justify-center cursor-pointer shadow-sm border border-slate-200" title="Pausar" type="button"><i class="fas fa-pause"></i></button>
                                    <button onclick="cancelDownload('${id}')" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-600 transition flex items-center justify-center cursor-pointer shadow-sm border border-slate-200" title="Cancelar" type="button"><i class="fas fa-times"></i></button>
                                `;
                        } else if (data.status === 'paused') {
                            document.getElementById(`percent-${id}`).textContent = "PAUSADO";
                            if (bar) {
                                bar.classList.remove('animate-pulse', 'bg-blue-500');
                                bar.classList.add('bg-yellow-500');
                            }
                            controls.innerHTML = `
                                    <button onclick="resumeDownload('${id}')" class="w-10 h-10 rounded-full bg-yellow-100 text-yellow-600 hover:bg-green-100 hover:text-green-600 transition flex items-center justify-center cursor-pointer shadow-sm border border-yellow-200" title="Reanudar" type="button"><i class="fas fa-play"></i></button>
                                    <button onclick="cancelDownload('${id}')" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-600 transition flex items-center justify-center cursor-pointer shadow-sm border border-slate-200" title="Cancelar" type="button"><i class="fas fa-times"></i></button>
                                `;
                        } else if (data.status === 'finished') {
                            clearInterval(activeIntervals[id]);
                            delete activeIntervals[id];

                            if (titleEl) titleEl.textContent = "¡Descarga Completada!";
                            if (bar) {
                                bar.classList.remove('animate-pulse');
                                bar.classList.add('bg-green-500');
                            }
                            controls.classList.add('hidden');

                            const actions = document.getElementById(`actions-${id}`);
                            if (actions) actions.classList.remove('hidden');
                            loadHistory();
                        } else if (data.status === 'error') {
                            clearInterval(activeIntervals[id]);
                            delete activeIntervals[id];
                            if (titleEl) titleEl.textContent = "Error: " + data.error;
                            if (bar) bar.classList.add('bg-red-500');
                            controls.classList.add('hidden');
                        }
                    }

                } catch (e) {
                    console.error(e);
                }
            }, 800);
        }

        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

            const states = {};

                const id = folder.getAttribute('data-folder-id');
                if (id) {
                    states[id] = folder.open;

        function restoreFolderStates() {
            const saved = localStorage.getItem('folderStates');
            if (!saved) return;

            try {
                const states = JSON.parse(saved);
                document.querySelectorAll('.folder-history, .folder-downloads').forEach(folder => {
                    const id = folder.getAttribute('data-folder-id');
                    if (id && states.hasOwnProperty(id)) {
                        folder.open = states[id];
                    }
                });
            } catch (e) {
                console.error('Error restoring folder states:', e);
            }
        }

                };

                try {

                            browser: document.getElementById('browserSelect').value,
                            force: false
                        })

                } catch (e) {

                await new Promise(r => setTimeout(r, 500));

        async function handleImageUpload(event) {
            const fileInput = event.target;
            const file = fileInput.files[0];
            if (!file) return;

            // Check file size
            const maxBase64Size = 5 * 1024 * 1024; // 5MB
            const warningSize = 2 * 1024 * 1024; // 2MB

            const urlInput = document.getElementById('bg-image-url');
            const originalValue = urlInput.value;

            // For files >5MB, use server upload
            if (file.size > maxBase64Size) {
                urlInput.value = 'Subiendo al servidor... Por favor espera';
                urlInput.disabled = true;

                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const response = await fetch('/api/upload-background', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success) {
                        urlInput.value = result.url;
                        await applyImageBackground(result.url, document.getElementById('bg-brightness').value, false);
                        showAlert(
                            `✅ Imagen subida al servidor (${(result.size / 1024 / 1024).toFixed(1)}MB).\n\n` +
                            `Se guardó en: ${result.filename}\n\n` +
                            `Esta opción es mejor para archivos grandes - no consume memoria del navegador.`,
                            '✓ Upload Exitoso'
                        );
                    } else {
                        throw new Error(result.error || 'Error desconocido');
                    }
                } catch (error) {
                    urlInput.value = originalValue;
                    showAlert('Error al subir archivo: ' + error.message, '❌ Error');
                } finally {
                    urlInput.disabled = false;
                }
                return;
            }

            // For files <=5MB, use base64 (faster, no server storage)
            urlInput.value = 'Cargando imagen... Por favor espera';
            urlInput.disabled = true;

            try {
                // Warn about file size
                if (file.size > warningSize) {
                    console.warn(`⚠️ Archivo detectado: ${(file.size / 1024 / 1024).toFixed(1)}MB. Usando base64.`);
                }

                // Use async file reading
                const result = await readFileAsDataURL(file);
                urlInput.value = result;
                await applyImageBackground(result, document.getElementById('bg-brightness').value, false);
            } catch (error) {
                urlInput.value = originalValue;
                showAlert('Error al cargar la imagen: ' + error.message, '❌ Error');
            } finally {
                urlInput.disabled = false;
                // Allow selecting the same file again if needed.
                fileInput.value = '';
            }
        }

        async function handleVideoUpload(event) {
            const fileInput = event.target;
            const file = fileInput.files[0];
            if (!file) return;

            // Check file size
            const maxBase64Size = 5 * 1024 * 1024; // 5MB
            const warningSize = 2 * 1024 * 1024; // 2MB

            const urlInput = document.getElementById('bg-video-url');
            const originalValue = urlInput.value;

            // For files >5MB, use server upload
            if (file.size > maxBase64Size) {
                urlInput.value = 'Subiendo al servidor... Por favor espera';
                urlInput.disabled = true;

                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const response = await fetch('/api/upload-background', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success) {
                        urlInput.value = result.url;
                        showAlert(
                            `✅ Video subido al servidor (${(result.size / 1024 / 1024).toFixed(1)}MB).\n\n` +
                            `Se guardó en: ${result.filename}\n\n` +
                            `Videos grandes SIEMPRE deben subirse al servidor - no uses base64.`,
                            '✓ Upload Exitoso'
                        );
                    } else {
                        throw new Error(result.error || 'Error desconocido');
                    }
                } catch (error) {
                    urlInput.value = originalValue;
                    showAlert('Error al subir archivo: ' + error.message, '❌ Error');
                } finally {
                    urlInput.disabled = false;
                }
                return;
            }

            // For files <=5MB, use base64
            urlInput.value = 'Cargando video... Por favor espera';
            urlInput.disabled = true;

            try {
                // Warn about file size
                if (file.size > warningSize) {
                    console.warn(`⚠️ Video detectado: ${(file.size / 1024 / 1024).toFixed(1)}MB. Usando base64.`);
                }

                // Use async file reading
                const result = await readFileAsDataURL(file);
                urlInput.value = result;
            } catch (error) {
                urlInput.value = originalValue;
                showAlert('Error al cargar el video: ' + error.message, '❌ Error');
            } finally {
                urlInput.disabled = false;
                // Allow selecting the same file again if needed.
                fileInput.value = '';
            }
        }

        // Helper function for async file reading
        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(new Error('Error al leer el archivo'));
                reader.readAsDataURL(file);
            });
        }

        function updateImageBrightness(value) {
            document.getElementById('brightness-value').textContent = value + '%';
        }

        function updateVideoBrightness(value) {
            document.getElementById('video-brightness-value').textContent = value + '%';
        }

        function updatePanelOpacity(value, persist = true) {
            const safeValue = Math.max(35, Math.min(95, parseInt(value || '76', 10)));
            const ratio = safeValue / 100;
            const paneRatio = Math.max(0.30, Math.min(0.90, ratio - 0.14));
            const inputRatio = Math.max(0.32, Math.min(0.92, ratio - 0.12));
            const tabRatio = Math.max(0.28, Math.min(0.88, ratio - 0.21));

            const rootStyle = document.documentElement.style;
            rootStyle.setProperty('--custom-card-alpha', ratio.toFixed(2));
            rootStyle.setProperty('--custom-pane-alpha', paneRatio.toFixed(2));
            rootStyle.setProperty('--custom-input-alpha', inputRatio.toFixed(2));
            rootStyle.setProperty('--custom-tab-alpha', tabRatio.toFixed(2));

            const label = document.getElementById('panel-opacity-value');
            if (label) {
                label.textContent = `${safeValue}%`;
            }

            if (persist) {
                localStorage.setItem('bg-panel-opacity', String(safeValue));
            }
        }

        async function applyImageBackground(imageUrl, brightness, saveToStorage = true) {
            if (!imageUrl) {
                throw new Error('URL de imagen vacía');
            }

            const bgImage = document.getElementById('bg-image');
            const bgVideo = document.getElementById('bg-video');

            await new Promise((resolve, reject) => {
                const probe = new Image();
                probe.onload = resolve;
                probe.onerror = () => reject(new Error('No se pudo cargar la imagen. Revisa el archivo o la URL.'));
                probe.src = imageUrl;
            });

            bgImage.src = imageUrl;
            bgImage.style.filter = `brightness(${brightness / 100})`;
            bgImage.classList.remove('hidden');
            bgVideo.classList.add('hidden');
            bgVideo.pause();
            document.body.classList.add('custom-bg');

            if (saveToStorage) {
                localStorage.setItem('bg-type', 'image');
                localStorage.setItem('bg-image-url', imageUrl);
                localStorage.setItem('bg-brightness', brightness);
            }
        }

        async function applyBackgroundSettings() {
            const activeTab = document.getElementById('bg-tab-image').classList.contains('glass-button') ? 'image' : 'video';

            if (activeTab === 'image') {
                const imageUrl = document.getElementById('bg-image-url').value.trim();
                const brightness = document.getElementById('bg-brightness').value;

                if (!imageUrl) {
                    showAlert('Por favor ingresa una URL de imagen o sube un archivo', '⚠️ URL Requerida');
                    return;
                }

                try {
                    await applyImageBackground(imageUrl, brightness, true);
                } catch (error) {
                    showAlert(error.message || 'No se pudo aplicar la imagen de fondo', '❌ Error');
                    return;
                }

                showAlert('✨ Fondo de imagen aplicado correctamente', '✓ Éxito');
            } else {
                const videoUrl = document.getElementById('bg-video-url').value.trim();
                const brightness = document.getElementById('bg-video-brightness').value;

                if (!videoUrl) {
                    showAlert('Por favor ingresa una URL de video o sube un archivo', '⚠️ URL Requerida');
                    return;
                }

                // Apply video background
                const bgImage = document.getElementById('bg-image');
                const bgVideo = document.getElementById('bg-video');

                bgVideo.src = videoUrl;
                bgVideo.style.filter = `brightness(${brightness / 100})`;
                bgVideo.classList.remove('hidden');
                bgVideo.play().catch(e => console.log('Video autoplay failed:', e));
                bgImage.classList.add('hidden');
                document.body.classList.add('custom-bg');

                // Save to localStorage
                localStorage.setItem('bg-type', 'video');
                localStorage.setItem('bg-video-url', videoUrl);
                localStorage.setItem('bg-brightness', brightness);

                showAlert('✨ Fondo de video aplicado correctamente', '✓ Éxito');
            }

            closeBackgroundSettings();
        }

        function resetBackground() {
            // Reset to default
            const bgImage = document.getElementById('bg-image');
            const bgVideo = document.getElementById('bg-video');

            bgImage.src = '/static/cinematic_bg.png';
            bgImage.style.filter = 'brightness(0.6)';
            bgImage.classList.remove('hidden');
            bgVideo.classList.add('hidden');
            bgVideo.pause();
            bgVideo.src = '';
            document.body.classList.remove('custom-bg');

            // Clear localStorage
            localStorage.removeItem('bg-type');
            localStorage.removeItem('bg-image-url');
            localStorage.removeItem('bg-video-url');
            localStorage.removeItem('bg-brightness');

            // Reset inputs
            document.getElementById('bg-image-url').value = '';
            document.getElementById('bg-video-url').value = '';
            document.getElementById('bg-brightness').value = '60';
            document.getElementById('bg-video-brightness').value = '60';
            updateImageBrightness(60);
            updateVideoBrightness(60);

            showAlert('✓ Fondo restablecido al predeterminado', '✓ Listo');
            closeBackgroundSettings();
        }

        function loadBackgroundSettings() {
            return; // DISABLED: Now handled by switchBgTab lazy loading
            const bgType = localStorage.getItem('bg-type');
            const brightness = localStorage.getItem('bg-brightness') || '60';

            // Set brightness values
            document.getElementById('bg-brightness').value = brightness;
            document.getElementById('bg-video-brightness').value = brightness;
            updateImageBrightness(brightness);
            updateVideoBrightness(brightness);

            if (bgType === 'image') {
                const imageUrl = localStorage.getItem('bg-image-url');
                if (imageUrl) {
                    document.getElementById('bg-image-url').value = imageUrl;
                }
                switchBgTab('image');
            } else if (bgType === 'video') {
                const videoUrl = localStorage.getItem('bg-video-url');
                if (videoUrl) {
                    document.getElementById('bg-video-url').value = videoUrl;
                }
                switchBgTab('video');
            }
        }

        function initializeBackground() {
            const bgType = localStorage.getItem('bg-type');
            const brightness = localStorage.getItem('bg-brightness') || '60';
            updatePanelOpacity(localStorage.getItem('bg-panel-opacity') || '76', false);

            if (bgType === 'image') {
                const imageUrl = localStorage.getItem('bg-image-url');
                if (imageUrl) {
                    const bgImage = document.getElementById('bg-image');
                    bgImage.src = imageUrl;
                    bgImage.style.filter = `brightness(${brightness / 100})`;
                    document.body.classList.add('custom-bg');
                }
            } else if (bgType === 'video') {
                const videoUrl = localStorage.getItem('bg-video-url');
                if (videoUrl) {
                    const bgImage = document.getElementById('bg-image');
                    const bgVideo = document.getElementById('bg-video');

                    bgVideo.src = videoUrl;
                    bgVideo.style.filter = `brightness(${brightness / 100})`;
                    bgVideo.classList.remove('hidden');
                    bgVideo.play().catch(e => console.log('Video autoplay failed:', e));
                    bgImage.classList.add('hidden');
                    document.body.classList.add('custom-bg');
                }
            } else {
                document.body.classList.remove('custom-bg');
            }
        }

        // Initialize background on page load
        initializeBackground();

        // Initialize
        setTimeout(loadHistory, 500);
    </script>
</body>
