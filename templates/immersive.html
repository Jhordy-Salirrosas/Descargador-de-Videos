<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxDownloader - Immersive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Parallax Background */
        #parallax-bg {
            transition: transform 0.1s ease-out;
        }

        /* Glassmorphism */
        .cyber-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .cyber-input {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(6, 182, 212, 0.3);
            transition: all 0.3s ease;
        }

        .cyber-input:focus {
            outline: none;
            border-color: rgba(6, 182, 212, 0.8);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        }

        .cyber-button {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.9), rgba(168, 85, 247, 0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .cyber-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(6, 182, 212, 0.4);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.8), rgba(168, 85, 247, 0.8));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #22d3ee 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Pulse Glow Animation */
        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(6, 182, 212, 0.3), 0 0 40px rgba(168, 85, 247, 0.2);
            }

            50% {
                box-shadow: 0 0 30px rgba(6, 182, 212, 0.5), 0 0 60px rgba(168, 85, 247, 0.3);
            }
        }

        .animate-pulse-glow {
            animation: pulse-glow 3s ease-in-out infinite;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(6, 182, 212, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(6, 182, 212, 0.7);
        }
    </style>
</head>

    <!-- Particles & Parallax Scripts -->
    <script>
        // ==================== PARALLAX EFFECT ====================
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            const bg = document.getElementById('parallax-bg');
            if (bg) {
                bg.style.transform = `translate(${x}px, ${y}px)`;
            }
        });

        // ==================== PARTICLE SYSTEM ====================
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 80;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(6, 182, 212, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        initParticles();
        animateParticles();
    </script>

    <!-- ==================== ALL JAVASCRIPT FROM ORIGINAL INDEX.HTML (CLONED) ==================== -->
    <script>
        let currentSessionId = null;
        let activeIntervals = {}; // Map: downloadId -> intervalId
        let currentMetadata = {};
        let historyData = []; // Store history globally for checking

        function toggleManualMode() {
            const currentMode = localStorage.getItem('cookieMode') || 'auto';
            const newMode = currentMode === 'auto' ? 'manual' : 'auto';

            // Update storage
            localStorage.setItem('cookieMode', newMode);

            // Update UI
            updateCookieUI(newMode);

            // Sync hidden radio for form submission
            const radio = document.querySelector(`input[name="cookieMode"][value="${newMode}"]`);
            if (radio) radio.checked = true;
        }

        function updateCookieUI(mode) {
            if (mode === 'manual') {
                document.getElementById('manualCookiesArea').classList.remove('hidden');
                document.getElementById('autoCookiesArea').classList.add('hidden');
                document.getElementById('cookieSourceLabel').innerHTML = '<i class="fas fa-keyboard mr-1 text-slate-400"></i> Modo Manual (Debug)';
            } else {
                document.getElementById('manualCookiesArea').classList.add('hidden');
                document.getElementById('autoCookiesArea').classList.remove('hidden');
                document.getElementById('cookieSourceLabel').innerHTML = '<i class="fas fa-user-secret mr-1 text-blue-500"></i> Autenticación Automática';

                // Save browser default if exists
                const browser = document.getElementById('browserSelect').value;
                localStorage.setItem('preferredBrowser', browser);
            }
        }

        // Auto-save browser choice
        document.getElementById('browserSelect').addEventListener('change', (e) => {
            localStorage.setItem('preferredBrowser', e.target.value);
        });

        function formatDuration(seconds) {
            if (!seconds) return '--:--';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.ceil(seconds % 60);
            return h > 0 ? `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}` : `${m}:${s.toString().padStart(2, '0')}`;
        }

        async function analyzeVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const mode = document.querySelector('input[name="cookieMode"]:checked').value;
            let cookies = null;
            let browser = null;

            if (mode === 'manual') {
                cookies = document.getElementById('manualCookiesText').value.trim();
                if (!cookies) return await showAlert("⚠️ El campo de cookies está vacío. Por favor pega las cookies exportadas.");
            } else {
                browser = document.getElementById('browserSelect').value;
            }

            if (!url) return await showAlert("Ingresa una URL primero");

            // UI Reset
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('playlistArea').classList.add('hidden');

            const btn = document.getElementById('analyzeBtn');
            const spinner = document.getElementById('btnSpinner');
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            spinner.classList.remove('hidden');
            document.getElementById('btnText').textContent = "Procesando...";

            try {
                const res = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, cookies, browser })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error);

                currentSessionId = data.session_id;

                if (data.cookie_warning) {
                    const errDiv = document.getElementById('errorMsg');
                    errDiv.classList.remove('hidden');
                    document.getElementById('errorText').innerHTML = "<b>Aviso:</b> No se pudieron leer las cookies (Navegador bloqueado). Resultados limitados.";
                }

                // --- PLAYLIST LOGIC ---
                if (data.type === 'playlist') {
                    renderPlaylist(data.entries);
                    document.getElementById('playlistArea').classList.remove('hidden');
                    return;
                }

                // --- SINGLE VIDEO LOGIC ---
                currentMetadata = {
                    title: data.title,
                    thumbnail: data.thumbnail,
                    original_url: data.webpage_url || url,
                    uploader: data.uploader,
                    duration: data.duration
                };

                // Render Results
                document.getElementById('vidTitle').textContent = data.title;
                document.getElementById('vidThumb').src = data.thumbnail;
                document.getElementById('vidDuration').innerHTML = `<i class="far fa-clock mr-1"></i> ${formatDuration(data.duration)}`;
                document.getElementById('vidLink').href = data.webpage_url || url;

                renderSmartPresets(data.formats, url);

                document.getElementById('resultsArea').classList.remove('hidden');

            } catch (e) {
                document.getElementById('errorMsg').classList.remove('hidden');
                let msg = e.message;
                if (msg.includes('Failed to fetch')) {
                    msg = "Error de comunicación. Asegúrate de que la aplicación 'app.py' esté ejecutándose.";
                }
                document.getElementById('errorText').textContent = msg;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                spinner.classList.add('hidden');
                document.getElementById('btnText').textContent = "Analizar Enlace";
            }
        }

        async function checkAndStartDownload(formatId, url) {
            const existing = historyData.find(h => h.original_url === url && h.status === 'completed');
            if (existing) {
                const date = new Date(existing.timestamp).toLocaleDateString();
                if (await showConfirm(`Ya descargaste este video el <b>${date}</b>.<br><br>¿Quieres descargarlo de nuevo?<br><span class="text-sm opacity-75">(Esto borrará el archivo anterior si existe)</span>`, "⚠️ Archivo Duplicado", { icon: "fa-exclamation-triangle", iconBg: "linear-gradient(135deg, #f59e0b, #d97706)", confirmText: "Re-descargar" })) {
                    startDownload(formatId, url, true);
                }
                return;
            }
            startDownload(formatId, url, false);
        }

        async function startDownload(formatId, url, force = false) {
            const mode = document.querySelector('input[name="cookieMode"]:checked').value;
            let browser = null;
            if (mode === 'auto') browser = document.getElementById('browserSelect').value;

            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('urlInput').value = '';

            try {
                const res = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url, format_id: formatId,
                        session_id: currentSessionId,
                        metadata: { ...currentMetadata, mode: document.getElementById('audioMode').checked ? 'audio' : 'video' },
                        browser: browser,
                        force: force
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                addQueueItem(data.download_id, currentMetadata);
                pollProgress(data.download_id);
                setTimeout(loadHistory, 1000);

            } catch (e) {
                await showAlert("Error descarga: " + e.message, "Error", "fa-times-circle", "linear-gradient(135deg, #ef4444, #b91c1c)");
                document.getElementById('resultsArea').classList.remove('hidden');
            }
        }

        async function pollProgress(id) {
            if (activeIntervals[id]) clearInterval(activeIntervals[id]);

            let lastStatus = null;

            activeIntervals[id] = setInterval(async () => {
                try {
                    const res = await fetch(`/progress/${id}`);
                    if (res.status === 404) return;
                    const data = await res.json();

                    const setValid = (elId, val) => {
                        const el = document.getElementById(elId);
                        if (el) el.textContent = val;
                    };

                    setValid(`percent-${id}`, data.percent);
                    const bar = document.getElementById(`bar-${id}`);
                    if (bar) bar.style.width = data.percent;

                    setValid(`speed-${id}`, data.speed);
                    setValid(`size-${id}`, `${data.downloaded || '?'}`);
                    setValid(`remaining-${id}`, data.remaining || '--');
                    setValid(`filename-${id}`, data.filename || '...');
                    const titleEl = document.querySelector(`#card-${id} h3`);

                    const controls = document.getElementById(`controls-${id}`);

                    if (controls && data.status !== lastStatus) {
                        lastStatus = data.status;

                        if (data.status === 'processing' || data.status === 'downloading') {
                            if (titleEl) titleEl.textContent = "Procesando video...";
                            if (bar) {
                                bar.classList.add('animate-pulse');
                                bar.classList.remove('bg-yellow-500', 'bg-red-500');
                                bar.classList.add('bg-blue-500');
                            }
                            controls.innerHTML = `
                                    <button onclick="pauseDownload('${id}')" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 hover:bg-yellow-100 hover:text-yellow-600 transition flex items-center justify-center cursor-pointer shadow-sm border border-slate-200" title="Pausar" type="button"><i class="fas fa-pause"></i></button>
                                    <button onclick="cancelDownload('${id}')" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-600 transition flex items-center justify-center cursor-pointer shadow-sm border border-slate-200" title="Cancelar" type="button"><i class="fas fa-times"></i></button>
                                `;
                        } else if (data.status === 'paused') {
                            document.getElementById(`percent-${id}`).textContent = "PAUSADO";
                            if (bar) {
                                bar.classList.remove('animate-pulse', 'bg-blue-500');
                                bar.classList.add('bg-yellow-500');
                            }
                            controls.innerHTML = `
                                    <button onclick="resumeDownload('${id}')" class="w-10 h-10 rounded-full bg-yellow-100 text-yellow-600 hover:bg-green-100 hover:text-green-600 transition flex items-center justify-center cursor-pointer shadow-sm border border-yellow-200" title="Reanudar" type="button"><i class="fas fa-play"></i></button>
                                    <button onclick="cancelDownload('${id}')" class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-600 transition flex items-center justify-center cursor-pointer shadow-sm border border-slate-200" title="Cancelar" type="button"><i class="fas fa-times"></i></button>
                                `;
                        } else if (data.status === 'finished') {
                            clearInterval(activeIntervals[id]);
                            delete activeIntervals[id];

                            if (titleEl) titleEl.textContent = "¡Descarga Completada!";
                            if (bar) {
                                bar.classList.remove('animate-pulse');
                                bar.classList.add('bg-green-500');
                            }
                            controls.classList.add('hidden');

                            const actions = document.getElementById(`actions-${id}`);
                            if (actions) actions.classList.remove('hidden');
                            loadHistory();
                        } else if (data.status === 'error') {
                            clearInterval(activeIntervals[id]);
                            delete activeIntervals[id];
                            if (titleEl) titleEl.textContent = "Error: " + data.error;
                            if (bar) bar.classList.add('bg-red-500');
                            controls.classList.add('hidden');
                        }
                    }

                } catch (e) {
                    console.error(e);
                }
            }, 800);
        }

        function saveToDisk(id) {
            if (id) {
                window.location.href = `/download_file/${id}`;
            }
        }

            const card = document.getElementById(`card-${id}`);

                                                <span>• ${item.size_str || 'N/A'}</span>

                const content = document.getElementById(`${t}-content`);

                    btn.classList.add('glass-button', 'shadow-lg');
                    content.classList.remove('hidden');

        async function openFileInExplorer(filePath) {
            try {
                const res = await fetch('/api/open-file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file_path: filePath })
                });

                const data = await res.json();
                if (data.error) {
                    await showAlert('Error: ' + data.error, "Error de Archivo", "fa-folder-minus", "linear-gradient(135deg, #ef4444, #b91c1c)");

        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function enableEditMode(oldName, btnElement) {
            const container = btnElement.parentElement;
            const nameSpan = container.children[1];
            const currentName = nameSpan.textContent;

            container.onclick = (e) => e.stopPropagation();

            container.innerHTML = `
                    <i class="far fa-folder-open text-yellow-500"></i>
                    <input type="text" id="edit-input-folder-name-${oldName.replace(/\s/g, '-')}" value="${currentName}" 
                        class="border rounded px-2 py-0.5 text-sm text-slate-700 outline-none focus:ring-2 focus:ring-blue-500"
                        onclick="event.stopPropagation()"
                        onkeydown="if(event.key === 'Enter') saveFolderRename('${oldName.replace(/'/g, "\\'")}', this.value)">
                    <button onclick="event.stopPropagation(); saveFolderRename('${oldName.replace(/'/g, "\\'")}', document.getElementById('edit-input-folder-name-${oldName.replace(/\s/g, '-')}').value)" class="text-green-500 hover:text-green-600 px-1"><i class="fas fa-check"></i></button>
                    <button onclick="event.stopPropagation(); loadHistory()" class="text-red-400 hover:text-red-600 px-1"><i class="fas fa-times"></i></button>
                `;

            const input = container.querySelector('input');
            if (input) input.focus();
        }

        async function saveFolderRename(oldName, newName) {
            if (!newName || newName.trim() === "") return;
            if (newName === oldName) {
                loadHistory();
                return;
            }

            try {
                const res = await fetch('/rename_folder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_name: oldName, new_name: newName })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                loadHistory();

            } catch (e) {
                await showAlert("Error renombrando: " + e.message);
                loadHistory();
            }
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        async function handleDrop(ev, targetUploader) {
            ev.preventDefault();
            ev.target.closest('details').classList.remove('ring-2', 'ring-blue-400');

            const id = ev.dataTransfer.getData("application/midownloader-id");
            if (!id) return;

            if (!await showConfirm(`¿Mover video a carpeta <b>"${targetUploader}"</b>?`, "Mover Video", { icon: "fa-folder-open", iconBg: "linear-gradient(135deg, #3b82f6, #2563eb)" })) return;

            try {
                const res = await fetch('/reorganize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ download_id: id, target_uploader: targetUploader })
                });

                if (res.ok) {
                    loadHistory();
                } else {
                    const data = await res.json();
                    await showAlert("Error: " + data.error);
                }
            } catch (e) {
                await showAlert("Error reorganizando: " + e);
            }
        }

        async function moveHistoryFile(id) {
            try {
                const pickerRes = await fetch('/pick_folder');
                const picker = await pickerRes.json();

                if (picker.error) throw new Error(picker.error);
                if (!picker.path) return;

                const destination = picker.path;

                const res = await fetch('/move_file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ download_id: id, destination: destination })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error);

                await showAlert("¡Archivo movido exitosamente!");
                loadHistory();

            } catch (e) {
                await showAlert("Error: " + e.message);
            }
        }

        async function deleteHistory(id) {
            if (!await showConfirm("¿Estás seguro de que quieres eliminar este video del historial?", "Eliminar Historial", { icon: "fa-trash-alt", iconBg: "linear-gradient(135deg, #ef4444, #b91c1c)", confirmText: "Eliminar" })) return;
            await fetch(`/history/${id}`, { method: 'DELETE' });
            loadHistory();
        }

        async function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            await showAlert("Link copiado!");
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    document.getElementById('urlInput').value = text;
                }
            } catch (err) {
                await showAlert("Permiso denegado para leer portapapeles. ¡Pégalo manualmente!");
            }
        }

        function renderSmartPresets(formats, url) {
            const grid = document.getElementById('formatsGrid');
            grid.innerHTML = '';
            grid.className = "grid grid-cols-1 gap-4";

            if (!formats || formats.length === 0) {
                grid.innerHTML = `
                        <div class="p-4 bg-yellow-50 text-yellow-800 rounded-lg border border-yellow-200">
                            <h3 class="font-bold"><i class="fas fa-exclamation-triangle"></i> No se encontraron formatos de video</h3>
                            <p class="text-sm mt-1">
                            <p class="text-sm mt-2 text-slate-700">
                                <strong>Cómo solucionar el "Navegador Bloqueado":</strong>
                                <ul class="list-disc ml-5 mt-1 space-y-1">
                                    <li><strong>Opción 1 (Rápida):</strong> Busca el icono de Brave 🦁 en la <b>bandeja del sistema</b> (al lado de la hora en tu barra de tareas), dale click derecho y elige <b>"Exit"</b> o <b>"Salir"</b>. Luego vuelve a probar aqui.</li>
                                    <li><strong>Opción 2 (Segura):</strong> Usa el <a href="#" onclick="toggleManualMode(); return false;" class="text-blue-600 underline font-bold">Modo Manual</a>. Instala la extensión <a href="https://chrome.google.com/webstore/detail/get-cookiestxt-locally/cclelndahbckbenkjhflccgombaodnld" target="_blank" class="text-blue-600 underline">Get cookies.txt LOCALLY</a>, exporta tus cookies y pégalas arriba.</li>
                                </ul>
                            </p>
                            
                             <button onclick="document.getElementById('audioMode').checked = true; checkAndStartDownload('best', '${url}')" 
                                class="mt-3 w-full bg-purple-600 text-white font-bold py-2 rounded hover:bg-purple-700 transition">
                                <i class="fas fa-music"></i> Intentar descargar Audio
                            </button>
                        </div>
                     `;
                return;
            }

            const bestVideo = formats.find(f => f.resolution.includes('2160') || f.resolution.includes('1440') || f.resolution.includes('1080')) || formats[0];
            const economy = formats.find(f => f.resolution.includes('480') || f.resolution.includes('360')) || formats[formats.length - 1];

            const cards = [
                {
                    title: "🌟 Máxima Calidad",
                    desc: `Video ${bestVideo.resolution} (MP4) • Ideal para TV/PC`,
                    icon: "fas fa-crown text-yellow-500",
                    color: "border-yellow-200 bg-yellow-50 hover:border-yellow-400",
                    action: () => checkAndStartDownload(bestVideo.id, url)
                },
                {
                    title: "📱 Ahorro de Datos",
                    desc: `Video ${economy.resolution} (MP4) • Ligero para Móvil`,
                    icon: "fas fa-mobile-alt text-green-500",
                    color: "border-green-200 bg-green-50 hover:border-green-400",
                    action: () => checkAndStartDownload(economy.id, url)
                },
                {
                    title: "🎵 Solo Audio",
                    desc: "Extraer MP3 (Alta Calidad) • Sin Video",
                    icon: "fas fa-music text-purple-500",
                    color: "border-purple-200 bg-purple-50 hover:border-purple-400",
                    action: () => {
                        document.getElementById('audioMode').checked = true;
                        checkAndStartDownload(bestVideo.id, url);
                    }
                },
                {
                    title: "⚙️ Avanzado",
                    desc: "Elegir formato manualmente",
                    icon: "fas fa-cogs text-slate-500",
                    color: "border-slate-200 bg-slate-50 hover:border-slate-400",
                    action: () => renderFullList(formats, url)
                }
            ];

            cards.forEach(card => {
                const el = document.createElement('div');
                el.className = `p-4 rounded-xl border-2 cursor-pointer transition flex items-center gap-4 group ${card.color}`;
                el.onclick = card.action;
                el.innerHTML = `
                    <div class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-xl shrink-0">
                        <i class="${card.icon}"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-700">${card.title}</h4>
                        <p class="text-xs text-slate-500 uppercase font-semibold">${card.desc}</p>
                    </div>
                    <i class="fas fa-chevron-right ml-auto text-slate-400 group-hover:text-slate-600"></i>
                `;
                grid.appendChild(el);
            });
        }

        function renderFullList(formats, url) {
            const grid = document.getElementById('formatsGrid');
            grid.innerHTML = '';

            const backBtn = document.createElement('button');
            backBtn.className = "col-span-1 sm:col-span-2 mb-2 text-slate-500 hover:text-blue-600 text-sm font-bold flex items-center gap-2 transition";
            backBtn.onclick = () => renderSmartPresets(formats, url);
            backBtn.innerHTML = `<i class="fas fa-arrow-left"></i> Volver a Presets Inteligentes`;
            grid.appendChild(backBtn);

            grid.className = "grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-80 overflow-y-auto pr-1";

            formats.forEach(fmt => {
                const el = document.createElement('button');
                el.className = "flex justify-between items-center bg-white border border-slate-200 p-3 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition text-left group";
                el.onclick = () => checkAndStartDownload(fmt.id, url);
                el.innerHTML = `
                    <div>
                        <span class="block font-bold text-slate-700 group-hover:text-blue-700">video ${fmt.resolution}</span>
                        <span class="text-xs text-slate-400">${fmt.ext} ${fmt.note || ''}</span>
                    </div>
                    <span class="text-sm font-semibold text-slate-500 bg-slate-100 px-2 py-1 rounded">${fmt.size}</span>
                `;
                grid.appendChild(el);
            });
        }

        function renderPlaylist(entries) {
            const grid = document.getElementById('playlistGrid');
            grid.innerHTML = '';

            entries.forEach((entry, idx) => {
                const el = document.createElement('div');
                el.className = "flex items-center gap-3 p-3 bg-white rounded border border-slate-100 hover:bg-blue-50 transition";
                el.innerHTML = `
                    <input type="checkbox" id="pl-${entry.id}" value="${entry.url}" checked 
                        data-title="${entry.title}" data-thumb="${entry.thumbnail}" data-dur="${entry.duration}"
                        class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
                    
                    <img src="${entry.thumbnail}" class="w-16 h-10 object-cover rounded bg-slate-200">
                    
                    <div class="flex-1 min-w-0">
                         <label for="pl-${entry.id}" class="block text-sm font-semibold text-slate-700 truncate cursor-pointer select-none">${entry.title}</label>
                         <span class="text-xs text-slate-400 capitalize">${entry.uploader || 'Unknown'} • ${formatDuration(entry.duration)}</span>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        function toggleAllPlaylist(state) {
            document.querySelectorAll('#playlistGrid input[type="checkbox"]').forEach(cb => cb.checked = state);
        }

        async function downloadSelectedPlaylist() {
            const checkboxes = document.querySelectorAll('#playlistGrid input[type="checkbox"]:checked');
            if (checkboxes.length === 0) return await showAlert("Selecciona al menos un video.");

            const mode = document.getElementById('audioMode').checked ? 'audio' : 'video';
            const count = checkboxes.length;

            if (!confirm(`¿Iniciar descarga de ${count} videos en modo ${mode.toUpperCase()}?`)) return;

            document.getElementById('playlistArea').classList.add('hidden');
            document.getElementById('urlInput').value = '';

            for (const cb of checkboxes) {
                const url = cb.value;
                const meta = {
                    title: cb.dataset.title,
                    thumbnail: cb.dataset.thumb,
                    duration: parseInt(cb.dataset.dur || 0),
                    original_url: url
                };

                try {
                    const res = await fetch('/download', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            url: url,
                            format_id: 'bestvideo',
                            session_id: currentSessionId,
                            metadata: { ...meta, mode: mode },
                            browser: document.getElementById('browserSelect').value,
                            force: false
                        })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        addQueueItem(data.download_id, meta);
                        pollProgress(data.download_id);
                    }
                } catch (e) {
                    console.error("Skipped playlist item", e);
                }

                await new Promise(r => setTimeout(r, 500));
            }
            setTimeout(loadHistory, 1000);
        }

        async function pauseDownload(id) {
            await fetch(`/pause/${id}`, { method: 'POST' });
        }

        async function resumeDownload(id) {
            await showAlert("Para reanudar, vuelve a analizar y descargar el video. El sistema detectará los archivos parciales.");
        }

        async function cancelDownload(id) {
            if (await showConfirm("¿Estás seguro de cancelar esta descarga?", "⚠️ Cancelar Descarga", { icon: "fa-times-circle", iconBg: "linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(220, 38, 38, 0.3))" })) {
                pauseDownload(id);
                document.getElementById(`queue-${id}`).remove();
            }
        }

        (function initPreferences() {
            const savedMode = localStorage.getItem('cookieMode') || 'auto';
            const savedBrowser = localStorage.getItem('preferredBrowser');

            updateCookieUI(savedMode);
            const radio = document.querySelector(`input[name="cookieMode"][value="${savedMode}"]`);
            if (radio) radio.checked = true;

            if (savedBrowser) {
                document.getElementById('browserSelect').value = savedBrowser;
            }
        })();

        // CUSTOM MODAL SYSTEM
        let modalResolve = null;

        function showAlert(message, title = '⚠️ Aviso', icon = 'fa-exclamation-circle', iconBg = 'linear-gradient(135deg, rgba(251, 191, 36, 0.3), rgba(245, 158, 11, 0.3))') {
            const modal = document.getElementById('customModal');
            if (!modal) return Promise.resolve();
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const modalIcon = document.getElementById('modalIcon');
            const modalImage = document.getElementById('modalImage');
            const modalCancel = document.getElementById('modalCancel');

            modalImage.classList.add('hidden');
            modalCancel.classList.add('hidden');

            modalTitle.textContent = title;
            modalContent.innerHTML = message;
            modalIcon.style.background = iconBg;
            modalIcon.innerHTML = `<i class="fas ${icon}"></i>`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            return new Promise(resolve => { modalResolve = resolve; });
        }

        function showConfirm(message, title = '❓ Confirmación', options = {}) {
            const modal = document.getElementById('customModal');
            if (!modal) return Promise.resolve(false);
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const modalIcon = document.getElementById('modalIcon');
            const modalImage = document.getElementById('modalImage');
            const modalCancel = document.getElementById('modalCancel');
            const modalThumbnail = document.getElementById('modalThumbnail');
            const modalVideoTitle = document.getElementById('modalVideoTitle');

            modalCancel.classList.remove('hidden');

            modalTitle.textContent = title;
            modalContent.innerHTML = message;
            modalIcon.style.background = options.iconBg || 'linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(147, 51, 234, 0.3))';
            modalIcon.innerHTML = `<i class="fas ${options.icon || 'fa-question-circle'}"></i>`;

            if (options.thumbnail && options.videoTitle) {
                modalImage.classList.remove('hidden');
                modalThumbnail.src = options.thumbnail;
                modalVideoTitle.textContent = options.videoTitle;
            } else {
                modalImage.classList.add('hidden');
            }

            document.getElementById('modalConfirm').textContent = options.confirmText || 'Aceptar';
            modalCancel.textContent = options.cancelText || 'Cancelar';

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            return new Promise(resolve => { modalResolve = resolve; });
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            if (modalResolve) {
                modalResolve(false);
                modalResolve = null;
            }
        }

        function confirmModal() {
            const modal = document.getElementById('customModal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            if (modalResolve) {
                modalResolve(true);
                modalResolve = null;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        const modalEl = document.getElementById('customModal');
        if (modalEl) {
            modalEl.addEventListener('click', (e) => {
                if (e.target.id === 'customModal') closeModal();
            });
        }

        // Initialize
        setTimeout(loadHistory, 500);
    </script>
</body>

</html>
